<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://pieware2.vercel.app">
    <title>Redirecting to Pieware 2...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #0a0a0a;
            color: #D4AF37;
        }
        .redirect-container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        p {
            margin: 0.5rem 0 0;
            color: #888;
        }
        a {
            color: #D4AF37;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="spinner"></div>
        <h1>Redirecting to Pieware 2...</h1>
        <p>If you are not redirected automatically, <a href="https://pieware2.vercel.app">click here</a>.</p>
    </div>
    <script>
        // Fallback redirect in case meta refresh doesn't work
        window.location.href = 'https://pieware2.vercel.app';
    </script>
</body>
</html>
